name: Daily Shorts Generator & Uploader

on:
  schedule:
    # Runs once a day at 12:00 UTC (1 Short per day)
    - cron: '0 12 * * *'

  workflow_dispatch: # Allows manual run for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent hung renders consuming the full 6-hour limit

    # Required permissions to commit and push heartbeat.txt back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install System Dependencies
        run: |
          if command -v ffmpeg &> /dev/null; then
            echo "ffmpeg is pre-installed. Fast-skipping system package installation."
          else
            echo "Missing ffmpeg. Installing with fast acquisition timeout..."
            sudo apt-get update -o Acquire::Http::Timeout="10" -q || true
            sudo apt-get install -y -o Acquire::Http::Timeout="10" ffmpeg imagemagick
          fi
          
          # Fix ImageMagick security policies that restrict TextClip operations
          echo "Applying ImageMagick security policy patches..."
          if [ -f /etc/ImageMagick-6/policy.xml ]; then
            sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml
          fi
          if [ -f /etc/ImageMagick-7/policy.xml ]; then
            sudo sed -i 's/none/read,write/g' /etc/ImageMagick-7/policy.xml
          fi

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Install Playwright Chromium Browser (if not cached)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install chromium --with-deps

      - name: Cache Kokoro TTS Model Weights
        uses: actions/cache@v4
        id: kokoro-cache
        with:
          path: ~/.cache/kokoro
          key: kokoro-onnx-v1.0-v4

      - name: Pre-Download Kokoro TTS Model Assets (if not cached)
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/kokoro
          curl -L --retry 5 --retry-delay 2 --connect-timeout 20 -o ~/.cache/kokoro/kokoro-v1.0.onnx.tmp "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
          mv ~/.cache/kokoro/kokoro-v1.0.onnx.tmp ~/.cache/kokoro/kokoro-v1.0.onnx
          curl -L --retry 5 --retry-delay 2 --connect-timeout 20 -o ~/.cache/kokoro/voices-v1.0.bin.tmp "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
          mv ~/.cache/kokoro/voices-v1.0.bin.tmp ~/.cache/kokoro/voices-v1.0.bin

      - name: Validate Kokoro TTS Assets Integrity
        run: |
          python3 - <<'EOF'
          import sys, zipfile
          from pathlib import Path
          import urllib.request

          cache = Path.home() / ".cache" / "kokoro"
          model = cache / "kokoro-v1.0.onnx"
          voices = cache / "voices-v1.0.bin"
          MIN_MODEL = 300 * 1024 * 1024
          MIN_VOICES = 25 * 1024 * 1024

          def redownload(url, dest):
              print(f"Re-downloading {dest.name}...")
              req = urllib.request.Request(url, headers={"User-Agent": "MPVSAP/2.5 KokoroValidator"})
              tmp = dest.with_suffix(".tmp")
              with urllib.request.urlopen(req, timeout=180) as r:
                  with open(tmp, "wb") as f:
                      while True:
                          chunk = r.read(2*1024*1024)
                          if not chunk: break
                          f.write(chunk)
              tmp.replace(dest)
              print(f"  -> {dest.stat().st_size/1e6:.1f} MB written")

          def is_zip_valid(path):
              try:
                  with zipfile.ZipFile(str(path), 'r') as zf:
                      bad = zf.testzip()
                      return bad is None and len(zf.namelist()) > 0
              except Exception as e:
                  print(f"  ZIP error: {e}")
                  return False

          # Check model
          if not model.exists() or model.stat().st_size < MIN_MODEL:
              print(f"FAIL: model missing/too small. Re-downloading...")
              redownload("https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx", model)
          else:
              print(f"Model OK: {model.stat().st_size/1e6:.1f} MB")

          # Check voices (ZIP archive, not .npy - magic bytes are PK\x03\x04)
          if not voices.exists() or voices.stat().st_size < MIN_VOICES or not is_zip_valid(voices):
              print(f"FAIL: voices-v1.0.bin missing, too small, or corrupt ZIP. Re-downloading...")
              if voices.exists(): voices.unlink()
              redownload("https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin", voices)
              if not is_zip_valid(voices):
                  print("FATAL: voices-v1.0.bin still invalid after re-download!")
                  sys.exit(1)
          else:
              with zipfile.ZipFile(str(voices)) as zf:
                  n = len(zf.namelist())
              print(f"Voices OK: {voices.stat().st_size/1e6:.1f} MB, {n} voice entries, ZIP valid")

          print("Kokoro asset validation PASSED.")
          EOF


      - name: Run Video Pipeline & Publish
        env:
          # Core API Keys & Webhook Monitoring
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WATERMARK_HANDLE: ${{ secrets.WATERMARK_HANDLE }}

          # YouTube Data API Credentials
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_PLAYLIST_SPACE: ${{ secrets.YT_PLAYLIST_SPACE }}
          YT_PLAYLIST_HISTORY: ${{ secrets.YT_PLAYLIST_HISTORY }}
          YT_PLAYLIST_TECH: ${{ secrets.YT_PLAYLIST_TECH }}

          # TikTok Content Posting API Credentials
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}

          # Meta Graph API Credentials (Instagram & Facebook Reels)
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python main.py

      - name: Persist Telemetry Logs & Reset Self-Healing Counter
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python maintenance_sync.py || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f heal_attempts.txt ]; then echo "0" > heal_attempts.txt; git add heal_attempts.txt; fi
          if [ -f logs/run_history.json ]; then git add logs/run_history.json; fi
          if [ -f dashboard/app/data/run_history.json ]; then git add dashboard/app/data/run_history.json; fi
          if [ -f past_topics.json ]; then git add past_topics.json; fi
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Persist telemetry logs and pipeline state [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
