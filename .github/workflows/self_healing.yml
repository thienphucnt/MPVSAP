name: AI Self-Healing & Diagnostics

on:
  workflow_run:
    workflows:
      - "Daily Shorts Generator & Uploader"
      - "Weekly Widescreen Long-Form Generator & Uploader"
    types:
      - completed

jobs:
  diagnose-and-heal:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check Heal Attempt Counter
        id: check_counter
        run: |
          MAX_ATTEMPTS=3
          COUNTER_FILE="heal_attempts.txt"
          CURRENT=0
          if [ -f "$COUNTER_FILE" ]; then
            CURRENT=$(cat "$COUNTER_FILE" | tr -d '[:space:]')
            if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then
              CURRENT=0
            fi
          fi
          echo "Current heal attempts: $CURRENT"
          if [ "$CURRENT" -ge "$MAX_ATTEMPTS" ]; then
            echo "Max heal attempts ($MAX_ATTEMPTS) reached. Stopping to prevent infinite loop."
            echo "should_continue=false" >> $GITHUB_OUTPUT
          else
            NEXT=$((CURRENT + 1))
            echo "$NEXT" > "$COUNTER_FILE"
            echo "Heal attempt $NEXT of $MAX_ATTEMPTS"
            echo "should_continue=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.11
        if: steps.check_counter.outputs.should_continue == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check_counter.outputs.should_continue == 'true'
        run: |
          pip install google-genai

      - name: Fetch Failed Logs
        if: steps.check_counter.outputs.should_continue == 'true'
        run: |
          gh run view ${{ github.event.workflow_run.id }} --log > failed_logs.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Self-Healing Diagnostics
        if: steps.check_counter.outputs.should_continue == 'true'
        id: heal
        run: |
          python self_heal.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Persist Heal Counter & Log Diagnosis Summary
        if: steps.check_counter.outputs.should_continue == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python safe_git_push.py "Record self-healing diagnostic attempt [skip ci]" heal_attempts.txt || true
          echo "Self-healing diagnostic completed."
